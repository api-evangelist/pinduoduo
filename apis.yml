name: Pinduoduo
description: >-
  Pinduoduo is a China-focused social commerce and agriculture-first e-commerce
  marketplace operated by PDD Holdings (Nasdaq: PDD), the multinational commerce
  group that also runs the cross-border marketplace Temu. Pinduoduo pioneered the
  "team purchase" (group-buy) model, connecting hundreds of millions of consumers
  directly with farmers, manufacturers, and merchants at scale. For developers,
  Pinduoduo runs a merchant-facing Open Platform (open.pinduoduo.com) that exposes
  gateway-style APIs for goods, orders, logistics, promotions, and store
  management to ISVs and merchant tools; that platform is geo-restricted to
  mainland China and was not directly reachable for artifact capture in this pass.
  This profile was surfaced as a portfolio company of Hongshan (formerly Sequoia
  Capital China) and enriched with verifiable corporate identity and domain
  security posture.
